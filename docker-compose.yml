services:

  app:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1001}
        GROUP_ID: ${GROUP_ID:-1001}
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - TAG_MANAGER_ID
      - DJANGO_DEBUG_TOOLBAR
      - SOLR_URL=http://solr:8983/solr/budgetportal
      - DEBUG_CACHE
      - DJANGO_WHITENOISE_AUTOREFRESH=TRUE
      - PORT=8000
      - DB_HOST
      #- GUNICORN_WORKERS_ARG=1 # Useful for testing start.sh
    volumes:
      - .:/app    
    ports:
      - "8000:8000"
    depends_on:
      - solr
      - sqlserver
      - sqlserver.configurator
    links:
      - selenium

  # Should be same as app except for command and ports
  worker:
    build:
      context: .
      args:
        USER_ID: ${USER_ID:-1001}
        GROUP_ID: ${GROUP_ID:-1001}
    command: python manage.py qcluster
    environment:
      - DJANGO_DEBUG_TOOLBAR=${DJANGO_DEBUG_TOOLBAR:-False}
      - AWS_S3_ENDPOINT_URL=http://minio:9000
      - SOLR_URL=http://solr:8983/solr/budgetportal
    volumes:
      - .:/app
    depends_on:
      - solr

  nginx:
    build: ./nginx
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./static:/static:ro
      - ./nginx/certificates:/etc/nginx/ssl

  solr:
    build: "https://github.com/vulekamali/solr-dokku.git"
    image: budgetportal-solr
    ports:
      - "8983:8983"
    volumes:
      - solr-data:/opt/solr/server/solr/budgetportal/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  selenium:
    image: selenium/standalone-chrome:3.141
    ports:
      - 4444:4444
      - 5900:5900
      - 7900:7900
    shm_size: '2gb'
    environment:
      - JAVA_OPTS=-Dwebdriver.chrome.whitelistedIps=

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=1StrongPwd!!
      - MSSQL_PID=Developer
      - MSSQL_TLS_CERT=/var/opt/mssql/cert.pfx
      - MSSQL_TLS_KEY_PASSWORD=mypassword
      - MSSQL_FORCE_ENCRYPTION=1
    user: root
    ports:
      - 1433:1433
    volumes:
      - sqlserver_data1:/var/opt/mssql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 1StrongPwd!! -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 10s
      timeout: 3s
  sqlserver.configurator:
    image: mcr.microsoft.com/mssql/server:2019-latest
    user: root
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    depends_on:
      sqlserver:
        condition: service_healthy
    command: >
      bash -c '
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 1StrongPwd!! -C -d master -i docker-entrypoint-initdb.d/init.sql;
      echo "All done!";
      '

volumes:
  solr-data:
  mssql_data:
    driver: local
  sqlserver_data1:
  static_volume:
