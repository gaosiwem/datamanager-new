<div style="display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; padding: 20px;">
     <div style="width: 80%; max-width: 1000px;">
          <div><h3>Consolidated Spending</h3></div>
          <div class="chart-container" id="chart-consolidation"></div>
     </div>
     <div style="width: 80%; max-width: 1000px;">
          <div><h3>National Budget Summary</h3></div>
          <div class="chart-container" id="chart-national-budget"></div>
     </div>
     <div style="width: 80%; max-width: 1000px;">
          <div><h3>Provincial Budget Summary</h3></div>
          <div class="chart-container" id="chart-provincial-budget"></div>
     </div>
</div>

<div class="tooltip" id="tooltip"></div>         

<script id="consolidationData" type="application/json">{{ consolidated_spending |safe }}</script>
<script id="nationalBudgetData" type="application/json">{{ national_budget_spending |safe }}</script>
<script id="provincialBudgetData" type="application/json">{{ provincial_budget_spending |safe }}</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    function createTreeMapGraphs(dataId, containerId) {
        let treeMapData = document.getElementById(dataId);
        let dataset;

        if (treeMapData) {
            try {
                dataset = JSON.parse(treeMapData.textContent);
                dataset.children = dataset.children.map(d => ({
                    name: d.Name || d.name,
                    value: d.Count || d.value,
                    subprogrammes: d.children || []
                }));

                function createTreemap(containerId, data) {
                    const container = document.getElementById(containerId);
                    container.innerHTML = ""; // Clear previous SVG
                    const width = container.clientWidth;
                    const height = Math.min(width * 0.75, 500); // Maintain aspect ratio

                    const svg = d3.select(`#${containerId}`)
                                  .append("svg")
                                  .attr("width", width)
                                  .attr("height", height);

                    const tooltip = d3.select("#tooltip");

                    const root = d3.hierarchy(data)
                                   .sum(d => Math.log1p(d.value * 0.2 || 1))
                                   .sort((a, b) => b.value - a.value);

                    const treemap = d3.treemap()
                                      .size([width, height])
                                      .padding(4);

                    treemap(root);

                    const color = d3.scaleOrdinal()
                                    .domain(["Category1", "Category2", "Category3", "Category4", "Category5", "Category6", "Category7"])
                                    .range(["#2B3BB0", "#85294E", "#1A4641", "#27605C", "#F08B32", "#4C362C", "#6A4D42"]);

                    const nodes = svg.selectAll("g")
                                     .data(root.leaves())
                                     .enter().append("g")
                                     .attr("transform", d => `translate(${d.x0},${d.y0})`);

                    nodes.append("rect")
                         .attr("class", "node")
                         .attr("width", d => d.x1 - d.x0)
                         .attr("height", d => d.y1 - d.y0)
                         .attr("fill", d => color(d.data.name))
                         .on("mouseover", function (event, d) {
                              tooltip.style("display", "block")
                                     .html(`<strong>${d.data.name}</strong><br>Value: ${d.data.value}`)
                                     .style("left", `${event.pageX + 10}px`)
                                     .style("top", `${event.pageY + 10}px`);
                         })
                         .on("mousemove", function (event) {
                              tooltip.style("left", `${event.pageX + 10}px`)
                                     .style("top", `${event.pageY + 10}px`);
                         })
                         .on("mouseout", () => tooltip.style("display", "none"));

                    nodes.append("text")
                         .attr("x", 5)
                         .attr("y", 20)
                         .attr("fill", "white")
                         .style("font-size", "12px")
                         .text(d => d.data.name);

                    nodes.append("text")
                         .attr("x", d => (d.x1 - d.x0) / 4)
                         .attr("y", d => (d.y1 - d.y0) / 1.5)
                         .attr("fill", "white")
                         .style("font-size", "12px")
                         .text(d => formatValues(d.data.value));
                }

                createTreemap(containerId, dataset);
            } catch (error) {
                console.error("JSON Parse Error:", error);
            }
        } else {
            console.error("Treemap data not found!");
        }
    }

    createTreeMapGraphs("consolidationData", "chart-consolidation");
    createTreeMapGraphs("nationalBudgetData", "chart-national-budget");
    createTreeMapGraphs("provincialBudgetData", "chart-provincial-budget");

    window.addEventListener("resize", () => {
        createTreeMapGraphs("consolidationData", "chart-consolidation");
        createTreeMapGraphs("nationalBudgetData", "chart-national-budget");
        createTreeMapGraphs("provincialBudgetData", "chart-provincial-budget");
    });

});

function formatValues(value) {
            if (value >= 1e12) {
                return `R ${(value / 1e12).toFixed(1).toLocaleString()} trillion`; // Trillions
            } else if (value >= 1e9) {
                return `R ${(value / 1e9).toFixed(1).toLocaleString()} billion`; // Billions
            } else if (value >= 1e6) {
                return `R ${(value / 1e6).toFixed(1).toLocaleString()} millions`; // Millions
            } else if (value >= 1e3) {
                return `R ${(value / 1e3).toFixed(1).toLocaleString()} thousands`; // Thousands
            } else {
                return 'R ' + value.toLocaleString(); // Default formatting
            }
        }

</script>

<style>
    .chart-container {
        width: 100%;
        max-width: 1000px;
        height: auto;
        margin: 20px 0;
        background: #f4f4f4;
        border-radius: 8px;
        padding: 10px;
    }

    .tooltip {
        position: absolute;
        display: none;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        pointer-events: none;
    }
</style>
