<div style="display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; padding: 20px;">
     <div style="width: 80%; max-width: 1000px;">
          <div>
               <h3>Consolidated Budget Summary</h3>
               <p style="font-weight: bold; font-size: 16px;">{{ consolidated_spending_total |safe }}</p>
          </div>
          <div class="chart-container" id="chart-consolidation"></div>
     </div>
     <div style="width: 80%; max-width: 1000px;">
          <div>
               <h3>National Budget Summary</h3>
               <p style="font-weight: bold; font-size: 16px;">{{ national_budget_spending_total |safe }}</p>
          </div>
          <div class="chart-container" id="chart-national-budget"></div>
     </div>
     <div style="width: 80%; max-width: 1000px;">
          <div>
               <h3>Provincial Budget Summary</h3>
               <p style="font-weight: bold; font-size: 16px;">{{ provincial_budget_spending_total |safe }}</p>
          </div>
          <div class="chart-container" id="chart-provincial-budget"></div>
     </div>
</div>

<div class="tooltip" id="tooltip"></div>         

<script id="consolidationData" type="application/json">{{ consolidated_spending |safe }}</script>
<script id="nationalBudgetData" type="application/json">{{ national_budget_spending |safe }}</script>
<script id="provincialBudgetData" type="application/json">{{ provincial_budget_spending |safe }}</script>

<style>
    .chart-container {
        width: 100%;
        max-width: 1000px;
        height: auto;
        margin: 20px 0;
        background: #f4f4f4;
        border-radius: 8px;
        padding: 10px;
    }

    .tooltip {
        position: absolute;
        display: none;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 12px;
        pointer-events: none;
    }
</style>
