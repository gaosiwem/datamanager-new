server {
    listen 443 ssl;
    server_name sandbox.vulekamali.gov.za;  # Change this to your domain or server IP

    ssl_certificate /etc/nginx/ssl/Vulekamali-cert.crt;
    ssl_certificate_key /etc/nginx/ssl/Vulekamali-cert.key;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # Ensure this is included
    }
    
    
    location /static/ {
        alias /app/staticfiles/;
    }
}

